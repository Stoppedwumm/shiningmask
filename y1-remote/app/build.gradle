plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shiningmask.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shiningmask.remote'
        // Innioasis Y1 runs Android 4.2.2 (API 17).
        minSdk 17
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so `gradlew assembleRelease` gives an installable APK.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
